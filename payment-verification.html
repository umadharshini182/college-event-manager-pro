<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | Tech Spark 2027</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="payment-verification.css"
    >

</head>


<body>

    <div class="verification-background"></div>


    <main class="verification-page">

        <section class="verification-card">


            <!-- SUCCESS ICON -->

            <div class="success-icon">
                ✓
            </div>


            <!-- SUCCESS TEXT -->

            <p class="verification-step">
                PAYMENT VERIFIED
            </p>


            <h1>
                Payment Successful!
            </h1>


            <p class="verification-description">
                Your registration payment has been successfully confirmed.
            </p>


            <!-- AMOUNT -->

            <div class="amount-section">

                <span>Amount Paid</span>

                <strong>₹1,000</strong>

                <small id="selectedMethodText">
                    QR Payment
                </small>

            </div>


            <!-- SUCCESS MESSAGE -->

            <div class="success-message">

                <span>✓</span>

                <p>
                    Payment confirmed successfully
                </p>

            </div>


            <!-- RECEIPT BUTTON -->

            <button
                type="button"
                class="confirm-payment-button"
                id="viewReceipt"
            >

                View Payment Receipt

                <span>→</span>

            </button>


            <p class="verification-note">
                Your registration and payment details are ready.
            </p>


        </section>

    </main>


    <script src="payment-verification.js"></script>

</body>

</html>
