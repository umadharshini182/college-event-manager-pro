<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate Verification</title>

<style>

body{

font-family:Arial,sans-serif;
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;

}

.card{

background:white;
padding:40px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.2);
text-align:center;
width:450px;

}

h1{

color:#0b8f3d;

}

p{

font-size:18px;

}

</style>

</head>

<body>

<div class="card">
<h1>🎓 Certificate Verification</h1>

<h2 style="color:green;">
✅ Certificate Verified
</h2>

<p id="studentName"></p>

<p id="eventName"></p>

<p id="certificateId"></p>

<p id="date"></p>
</div>
<script>

async function verifyCertificate() {

    const params = new URLSearchParams(window.location.search);

    const id = params.get("certificate");

    const response = await fetch("/verify/" + id);

    const data = await response.json();

    if (!data.success) {

        document.body.innerHTML = `
        <h1 style="color:red;text-align:center;margin-top:100px;">
        ❌ Certificate Not Found
        </h1>
        `;

        return;

    }

    document.getElementById("certificateId").innerHTML =
        "<b>Certificate ID:</b> " + data.student.certificate_id;

    document.getElementById("studentName").innerHTML =
        "<b>Student:</b> " + data.student.fullname;

    document.getElementById("eventName").innerHTML =
        "<b>Event:</b> " + data.student.event;

    const formattedDate = new Date(data.student.certificate_date)
    .toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });

document.getElementById("date").innerHTML =
    "<b>Issued:</b> " + formattedDate;

}

verifyCertificate();

</script>

</body>

</html>
