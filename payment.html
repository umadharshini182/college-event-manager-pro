<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment</title>

<link rel="stylesheet" href="style.css">


</head>

<body>

<nav>

<div class="logo">
🎓 College Event Manager
</div>

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="privacy.html">Privacy</a></li>

</ul>

</nav>

<section class="details">

<div class="payment-box">

<h1>💳 Complete Payment</h1>

<p>
Review your registration details before making payment.
</p>

<div class="summary-grid">

<div class="summary-card">

<h3>Name</h3>

<p id="studentName"></p>

</div>

<div class="summary-card">

<h3>Event</h3>

<p id="eventName"></p>

</div>

<div class="summary-card">

<h3>Amount</h3>

<p>$12.00</p>

</div>

</div>

<button id="demoPayBtn" class="submit-btn">

Pay ₹1000

</button>

</div>

</section>
<script>

alert("Payment JS Loaded");

const student = JSON.parse(localStorage.getItem("studentData"));

if (!student) {
    alert("Student data not found. Please register again.");
    window.location.href = "register.html";
}

document.getElementById("studentName").innerHTML = student.fullname;
document.getElementById("eventName").innerHTML = student.event;

document.getElementById("demoPayBtn").addEventListener("click", async function () {

    alert("Button clicked");

    try {

        const register = await fetch("/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(student)

        });

        console.log(register.status);

const result = await register.json();

console.log(result);

        if (result.success) {

            student.registrationId = result.id;

            localStorage.setItem(
                "studentData",
                JSON.stringify(student)
            );

            window.location.href = "receipt.html";

        } else {

            alert(result.message || "Registration failed.");

        }

    } catch (err) {

        console.error(err);
        alert("Server connection failed.");

    }

});

</script>

</body>

</html>
