<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration Verification | College Event Manager</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc
                );

            font-family:
                "Poppins",
                Arial,
                sans-serif;
        }

        .verify-container {

            width: 100%;
            max-width: 520px;

            padding: 35px;

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 22px;

            box-shadow:
                0 25px 70px
                rgba(15, 23, 42, 0.15);

            text-align: center;
        }

        .verify-icon {

            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #dcfce7;

            color: #16a34a;

            font-size: 38px;
            font-weight: 800;
        }

        .verify-container h1 {

            margin-bottom: 8px;

            color: #0f172a;

            font-size: 25px;
            font-weight: 800;
        }

        .verify-status {

            display: inline-block;

            margin-bottom: 25px;

            padding: 7px 14px;

            border-radius: 30px;

            background: #dcfce7;

            color: #15803d;

            font-size: 11px;

            font-weight: 800;
        }

        .verify-details {

            overflow: hidden;

            margin-top: 10px;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            background: #f8fafc;

            text-align: left;
        }

        .verify-row {

            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 15px 18px;

            border-bottom:
                1px solid #e2e8f0;
        }

        .verify-row:last-child {
            border-bottom: none;
        }

        .verify-row span {

            color: #64748b;

            font-size: 12px;
        }

        .verify-row strong {

            color: #0f172a;

            font-size: 12px;

            text-align: right;
        }

        .verify-footer {

            margin-top: 22px;

            color: #94a3b8;

            font-size: 10px;

            line-height: 1.5;
        }

        .invalid {

            background: #fef2f2;

            color: #dc2626;
        }

    </style>

</head>


<body>


<div class="verify-container">

    <div class="verify-icon" id="verifyIcon">
        ✓
    </div>


    <h1 id="verifyTitle">
        Registration Verified
    </h1>


    <div
        class="verify-status"
        id="verifyStatus"
    >
        VALID REGISTRATION
    </div>


    <div
        class="verify-details"
        id="verifyDetails"
    >

        <div class="verify-row">

            <span>
                Registration ID
            </span>

            <strong id="registrationId">
                Loading...
            </strong>

        </div>


        <div class="verify-row">

            <span>
                Student Name
            </span>

            <strong id="studentName">
                Loading...
            </strong>

        </div>


        <div class="verify-row">

            <span>
                Event
            </span>

            <strong id="event">
                Loading...
            </strong>

        </div>


        <div class="verify-row">

            <span>
                College
            </span>

            <strong id="college">
                Loading...
            </strong>

        </div>


        <div class="verify-row">

            <span>
                Payment Status
            </span>

            <strong id="paymentStatus">
                Loading...
            </strong>

        </div>


    </div>


    <div class="verify-footer">

        This verification page confirms the
        registration recorded by College Event Manager.

    </div>

</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );

    const registrationId =
        params.get("id");


    if (!registrationId) {

        showInvalid(
            "Registration ID missing."
        );

    }


    async function verifyRegistration() {

        try {

            const response =
                await fetch(
                    "/api/verify-registration?id=" +
                    encodeURIComponent(
                        registrationId
                    )
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                showInvalid(
                    data.message ||
                    "Registration not found."
                );

                return;
            }


            document.getElementById(
                "registrationId"
            ).textContent =
                data.registration.id;


            document.getElementById(
                "studentName"
            ).textContent =
                data.registration.fullname;


            document.getElementById(
                "event"
            ).textContent =
                data.registration.event;


            document.getElementById(
                "college"
            ).textContent =
                data.registration.college;


            document.getElementById(
                "paymentStatus"
            ).textContent =
                data.registration.payment_status;


        }

        catch (error) {

            console.error(error);

            showInvalid(
                "Unable to verify registration."
            );

        }

    }


    function showInvalid(message) {

        document.getElementById(
            "verifyIcon"
        ).textContent = "✕";


        document.getElementById(
            "verifyIcon"
        ).style.background =
            "#fee2e2";


        document.getElementById(
            "verifyIcon"
        ).style.color =
            "#dc2626";


        document.getElementById(
            "verifyTitle"
        ).textContent =
            "Registration Not Found";


        const status =
            document.getElementById(
                "verifyStatus"
            );

        status.textContent =
            message;

        status.classList.add(
            "invalid"
        );


        document.getElementById(
            "verifyDetails"
        ).style.display =
            "none";

    }


    if (registrationId) {

        verifyRegistration();

    }

</script>


</body>

</html>
