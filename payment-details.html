<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Details | College Event Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>

    <div class="logo">
        🎓 College Event Manager
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="privacy.html">Privacy</a></li>
    </ul>

</nav>

<section class="details">

    <div class="register-box">

        <h1>💳 Payment Details</h1>

        <p>
            College Event Manager – Registration Payment
        </p>

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="studentName" readonly>
        </div>

        <div class="form-group">
            <label>Event</label>
            <input type="text" id="eventName" readonly>
        </div>

        <div class="form-group">
            <label>Registration Amount</label>
            <input type="text" value="₹1,000" readonly>
        </div>

        <div class="form-group">
            <label>Payment Status</label>
            <input type="text" value="Demo Payment Verification" readonly>
        </div>

        <p style="margin-top:20px;">
            🔒 This QR page is part of the College Event Manager
            project demonstration.
        </p>

    </div>

</section>

<script>

const params = new URLSearchParams(
    window.location.search
);

const studentName =
    params.get("name") || "Student";

const eventName =
    params.get("event") || "College Event";

document.getElementById("studentName").value =
    studentName;

document.getElementById("eventName").value =
    eventName;

</script>

</body>

</html>
